version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hamzawakili15-cpu", email = "hamzawakili15@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "python-multipart>=0.0.32",
    "streamlit>=1.65.0",
